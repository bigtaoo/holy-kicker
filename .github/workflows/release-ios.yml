name: ios

# Holy Kicker's iOS app (docs/ios.md), built by ios-app.yml with theme monk. Corgi Commando has its
# own caller, release-ios-corgi.yml.
#
#   compile  every push to main that touches the shell: an unsigned simulator build, no secrets.
#   release  a tag ios-v* (e.g. ios-v1.0.0) or a manual run: archive, sign, export, upload to
#            App Store Connect (TestFlight). The build number is this workflow's run number.
#
# Release takes the repository's secrets as they are (ios-app.yml lists them), the profile being
# Holy Kicker's own: BUILD_PROVISION_PROFILE_BASE64, for com.gamestao.holykicker.

on:
  push:
    branches: [main]
    tags: ['ios-v*']
    paths:
      - 'client/ios/**'
      - 'client/capacitor.config.ts'
      - 'client/src/platform/ios/**'
      - 'client/package.json'
      - 'build/iosApp.mjs'
      - 'build/setIosApp.mjs'
      - '.github/workflows/release-ios.yml'
      - '.github/workflows/ios-app.yml'
  workflow_dispatch:
    inputs:
      destination:
        description: 'testflight uploads; none builds and signs the IPA only'
        required: true
        default: 'testflight'
        type: choice
        options: [testflight, none]

jobs:
  compile:
    if: github.event_name == 'push' && github.ref_type == 'branch'
    uses: ./.github/workflows/ios-app.yml
    with:
      theme: monk
      job: compile

  release:
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    uses: ./.github/workflows/ios-app.yml
    with:
      theme: monk
      job: release
      destination: ${{ inputs.destination || 'testflight' }}
    secrets: inherit
