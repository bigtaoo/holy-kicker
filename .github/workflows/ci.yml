name: ci

# Every push and pull request runs `npm run check` (typecheck, file length, tests, the server,
# WeChat and CrazyGames builds, the WeChat package gate). A push to main that passes then
# publishes the web build to Cloudflare at h.gamestao.com (wrangler/web.jsonc), the way
# daydayup's client-deploy.yml publishes b.gamestao.com.
#
# The deploy needs, in Settings -> Secrets and variables -> Actions:
#   Secrets    CLOUDFLARE_API_TOKEN   gamestao.com account, at least Workers Scripts:Edit
#              CLOUDFLARE_ACCOUNT_ID
#   Variables  WEB_DEPLOY_ENABLED = true   (unset: the deploy job is skipped, so CI stays
#                                           green before the secrets are in)
# The backend (server/) is not deployed here: `npm run deploy:server` ships it by hand.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  deploy-web:
    needs: check
    runs-on: ubuntu-latest
    if: ${{ vars.WEB_DEPLOY_ENABLED == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    concurrency:
      group: web-deploy
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: build web
        run: npm run build
      - name: deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4.118.0 deploy -c wrangler/web.jsonc
      - name: verify from the outside
        run: |
          set -eu
          for i in $(seq 1 10); do
            if curl -fsS --max-time 10 -o /dev/null https://h.gamestao.com/; then exit 0; fi
            sleep 3
          done
          echo "h.gamestao.com did not answer" >&2
          exit 1
