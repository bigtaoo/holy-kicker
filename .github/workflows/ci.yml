name: ci

# Every push and pull request runs `npm run check` (typecheck, file length, tests, the server,
# WeChat, CrazyGames and iOS web builds, the WeChat package gate). The iOS app itself is built by
# release-ios.yml on macOS. A push to main that passes then
# ships the backend to blightbloom (hk.gamestao.com) and, after it, publishes the web build to
# Cloudflare at h.gamestao.com (wrangler/web.jsonc). Backend first, so a client never goes
# live talking to routes the server does not have yet. A push that leaves the server bundle
# unchanged restarts nothing (server/deploy/ci-deploy.sh compares the files).
# Beside `check`, `smoke` builds every web dist (web, corgi, CrazyGames, Playgama, iOS) and plays
# each for 30 s in headless Chrome (build/smoke.mjs): a page error, a console error or no fight
# fails it, and no deploy runs without it.
# The corgi reskin (docs/reskin.md "Builds") publishes the same way to h.gamestao.com/new/
# (wrangler/new.jsonc) once NEW_WEB_DEPLOY_ENABLED is set; its build fails while any corgi art
# is missing, so the switch only goes on with the art complete. It shares hk.gamestao.com (server/src/game.ts).
#
# The deploys need, in Settings -> Secrets and variables -> Actions:
#   Secrets    CLOUDFLARE_API_TOKEN   gamestao.com account, at least Workers Scripts:Edit
#              CLOUDFLARE_API_TOKEN_NEW   the corgi's own (holy-kicker-new-ci): Workers Scripts:Edit
#                                     and, on the gamestao.com zone only, Workers Routes:Edit
#              CLOUDFLARE_ACCOUNT_ID
#              SERVER_DEPLOY_KEY      ssh key that can only run ci-deploy.sh on the box
#                                     (local copy D:\cloud\holykicker_ci_ed25519; server/README.md)
#   Variables  WEB_DEPLOY_ENABLED = true, SERVER_DEPLOY_ENABLED = true   (unset: that deploy
#                                     is skipped, so CI stays green before the secrets are in)
#              NEW_WEB_DEPLOY_ENABLED = true   the corgi build at h.gamestao.com/new/
#              SERVER_SSH_KNOWN_HOSTS   the box's pinned host key line

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

# a newer push cancels an older run, except on main, where a deploy may be halfway through
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: build the release dists
        working-directory: client
        # side by side and without tsc, which `check` runs
        run: |
          set -eu
          pids=""
          for c in vite.config.js vite.new.config.js vite.crazygames.config.js vite.playgama.config.js vite.ios.config.js; do
            npx vite build --config "$c" --logLevel warn > "/tmp/$c.log" 2>&1 & pids="$pids $!"
          done
          for p in $pids; do wait "$p" || { cat /tmp/*.log; exit 1; }; done
      # the runner's own Google Chrome (playwright-core downloads none)
      - run: npm run smoke

  deploy-server:
    needs: [check, smoke]
    runs-on: ubuntu-latest
    if: ${{ vars.SERVER_DEPLOY_ENABLED == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    concurrency:
      group: server-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: build server
        run: node server/build.mjs
      - name: deploy over ssh
        env:
          DEPLOY_KEY: ${{ secrets.SERVER_DEPLOY_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.SERVER_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          install -m 700 -d ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # pinned, never StrictHostKeyChecking=no: the key and payload go only to this box
          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cp server/deploy/Dockerfile server/deploy/docker-compose.yml server/deploy/package.json server/dist/
          # the forced command on the box reads this tar.gz from stdin (server/deploy/ci-deploy.sh)
          tar czf - -C server/dist server.mjs Dockerfile docker-compose.yml package.json |
            ssh -T -i ~/.ssh/deploy_key -o IdentitiesOnly=yes deploy@62.238.1.182
      - name: verify from the outside
        run: |
          set -eu
          for i in $(seq 1 10); do
            if curl -fsS --max-time 10 https://hk.gamestao.com/health; then echo; exit 0; fi
            sleep 3
          done
          echo "hk.gamestao.com/health did not answer" >&2
          exit 1

  deploy-web:
    needs: [check, smoke, deploy-server]
    runs-on: ubuntu-latest
    # runs when the server deploy succeeded or was switched off, never after it failed
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.smoke.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.deploy-server.result) && vars.WEB_DEPLOY_ENABLED == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    concurrency:
      group: web-deploy
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: build web
        run: npm run build
      - name: deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4.118.0 deploy -c wrangler/web.jsonc
      - name: verify from the outside
        run: |
          set -eu
          for i in $(seq 1 10); do
            if curl -fsS --max-time 10 -o /dev/null https://h.gamestao.com/; then exit 0; fi
            sleep 3
          done
          echo "h.gamestao.com did not answer" >&2
          exit 1

  deploy-new:
    needs: [check, smoke, deploy-server]
    runs-on: ubuntu-latest
    # like deploy-web, for the corgi reskin; its own switch, so either game ships on its own
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.smoke.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.deploy-server.result) && vars.NEW_WEB_DEPLOY_ENABLED == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    concurrency:
      group: new-deploy
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: build web (corgi)
        run: npm run build:new
      - name: deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_NEW }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4.118.0 deploy -c wrangler/new.jsonc
      - name: verify from the outside
        run: |
          set -eu
          for i in $(seq 1 10); do
            if curl -fsSL --max-time 10 https://h.gamestao.com/new/ | grep -q '/new/assets/'; then exit 0; fi
            sleep 3
          done
          echo "h.gamestao.com/new/ did not serve the corgi build" >&2
          exit 1
