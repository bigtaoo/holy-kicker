name: ios-app

# The iOS app (docs/ios.md): the Capacitor shell in client/ios wrapping client/dist-ios, for one app
# of client/src/platform/ios/apps.json. Called by release-ios.yml (Holy Kicker, theme monk) and
# release-ios-corgi.yml (Corgi Commando, theme corgi), so each app keeps its own triggers, run list
# and build numbers. The committed shell is Holy Kicker's; build/setIosApp.mjs writes the app's
# values over it first (a no-op for monk that still checks every anchor). Swift only compiles on
# macOS, so this runner is the only place the native side is ever built. Adapted from D:\funny's
# release-ios.yml (design/game/IOS_RELEASE.md there).
#
#   compile  an unsigned simulator build, no secrets, to catch a Swift or project error the
#            Windows machine cannot see.
#   release  archive, sign, export, upload to App Store Connect (TestFlight). destination 'none'
#            stops after the IPA, spending no build number. The build number is the caller's run
#            number.
#
# Release needs these secrets, passed by the caller (the account's certificate and API key from
# D:\cloud\ios; the profile is the app's own, named as apps.json `profile` says, docs/ios.md):
#   BUILD_CERTIFICATE_BASE64        Apple Distribution certificate (.p12), base64
#   P12_PASSWORD                    its export password
#   KEYCHAIN_PASSWORD               any string; the runner's temporary keychain
#   BUILD_PROVISION_PROFILE_BASE64  the app's App Store profile, base64
#   APPLE_TEAM_ID                   10-character team id
#   ASC_API_KEY_ID, ASC_API_ISSUER_ID, ASC_API_KEY_CONTENT_BASE64 (the .p8, base64)

on:
  workflow_call:
    inputs:
      theme:
        description: 'monk (Holy Kicker) or corgi (Corgi Commando), a key of apps.json'
        required: true
        type: string
      job:
        description: 'compile or release'
        required: true
        type: string
      destination:
        description: 'testflight uploads; none builds and signs the IPA only'
        required: false
        default: 'testflight'
        type: string
    secrets:
      BUILD_CERTIFICATE_BASE64:
        required: false
      P12_PASSWORD:
        required: false
      KEYCHAIN_PASSWORD:
        required: false
      BUILD_PROVISION_PROFILE_BASE64:
        required: false
      APPLE_TEAM_ID:
        required: false
      ASC_API_KEY_ID:
        required: false
      ASC_API_ISSUER_ID:
        required: false
      ASC_API_KEY_CONTENT_BASE64:
        required: false

env:
  THEME: ${{ inputs.theme }}
  # the web build of the theme: build:ios for monk, build:ios:new for the corgi
  BUILD_SCRIPT: ${{ inputs.theme == 'monk' && 'build:ios' || 'build:ios:new' }}

jobs:
  compile:
    if: inputs.job == 'compile'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set the shell to the app
        run: node build/setIosApp.mjs "$THEME"
      - run: npm run "$BUILD_SCRIPT"
      - name: Sync Capacitor (copies dist-ios, runs pod install)
        working-directory: client
        run: npx cap sync ios
      - name: Build for the simulator, unsigned
        run: |
          xcodebuild \
            -workspace client/ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            build \
            CODE_SIGNING_ALLOWED=NO

  release:
    if: inputs.job == 'release'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Set the shell to the app
        run: |
          set -eu
          node build/setIosApp.mjs "$THEME"
          echo "BUNDLE_ID=$(node build/setIosApp.mjs "$THEME" --print bundleId)" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$(node build/setIosApp.mjs "$THEME" --print profile)" >> "$GITHUB_ENV"
          echo "OTA_HOST=$(node build/setIosApp.mjs "$THEME" --print ota)" >> "$GITHUB_ENV"

      # The web bundle baked into this shell is <MARKETING_VERSION>.<run number>; hot updates
      # (ota-ios.yml) made for it count on from there, and must all rank below it.
      - name: Resolve the bundle version
        id: ver
        run: |
          set -eu
          MV=$(grep -o 'MARKETING_VERSION = [^;]*' client/ios/App/App.xcodeproj/project.pbxproj | sort -u | sed 's/.* = //')
          if ! echo "$MV" | grep -Eq '^[0-9]+\.[0-9]+$'; then echo "MARKETING_VERSION must be one X.Y (got: $MV)"; exit 1; fi
          V="$MV.${{ github.run_number }}"
          LIVE=$(curl -fsS --max-time 10 "$OTA_HOST/manifest.json" | jq -r .version || true)
          if [ -n "$LIVE" ] && [ "$(printf '%s\n%s\n' "$LIVE" "$V" | sort -V | tail -1)" != "$V" ]; then
            echo "the live hot update $LIVE outranks this shell's $V"; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "$BUNDLE_ID bundle version $V (live hot update: ${LIVE:-none})" >> "$GITHUB_STEP_SUMMARY"
      - name: Build the web bundle
        env:
          HK_BUNDLE_VERSION: ${{ steps.ver.outputs.version }}
        run: npm run "$BUILD_SCRIPT"

      - name: Sync Capacitor (copies dist-ios, runs pod install)
        working-directory: client
        run: npx cap sync ios

      # Podfile.lock cannot be made on Windows, so the run records what it resolved
      - name: Record resolved pod versions
        working-directory: client/ios/App
        run: |
          echo '### Resolved CocoaPods versions' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          sed -n '/^PODS:/,/^DEPENDENCIES:/p' Podfile.lock | sed '$d' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Set build number
        working-directory: client/ios/App
        run: agvtool new-version -all ${{ github.run_number }}

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}

      - name: Install provisioning profile
        run: |
          PP_PATH=$RUNNER_TEMP/profile.mobileprovision
          echo -n "${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}" | base64 --decode -o $PP_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Write ExportOptions.plist
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>${{ secrets.APPLE_TEAM_ID }}</string>
              <key>uploadSymbols</key>
              <true/>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>${BUNDLE_ID}</key>
                  <string>${PROFILE_NAME}</string>
              </dict>
          </dict>
          </plist>
          EOF

      - name: Archive and export the IPA
        run: |
          xcodebuild \
            -workspace client/ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            archive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"
          xcodebuild \
            -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.theme }}-App.ipa
          path: ${{ runner.temp }}/ipa/*.ipa

      - name: Upload to App Store Connect
        if: inputs.destination != 'none'
        run: |
          mkdir -p ~/private_keys
          echo -n "${{ secrets.ASC_API_KEY_CONTENT_BASE64 }}" | base64 --decode > ~/private_keys/AuthKey_${{ secrets.ASC_API_KEY_ID }}.p8
          xcrun altool \
            --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/ipa/App.ipa" \
            --apiKey "${{ secrets.ASC_API_KEY_ID }}" \
            --apiIssuer "${{ secrets.ASC_API_ISSUER_ID }}"
