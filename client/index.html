<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Holy Kicker</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #141816; touch-action: none; }
      canvas { display: block; }
      /* no text selection, long-press menu or tap flash on touch screens (a portal requirement) */
      html, body, canvas { -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      /* the loading screen, painted before any script arrives, all inline (no file to fetch): a warm
         glow and slow gold rays behind the cuju ball bouncing over its shadow, the title in the
         game's thick-outline sticker style and a bar that creeps on its own until the script
         arrives, then follows the real load (boot.ts sets --p); boot.ts removes it at the first screen */
      #boot { position: fixed; inset: 0; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; background: radial-gradient(circle at 50% 42%, #3a3020 0, #1f2219 38%, #141816 72%); font-family: system-ui, sans-serif; --p: 0; }
      #boot::before { content: ''; position: absolute; left: 50%; top: 42%; width: 180vmax; height: 180vmax; margin: -90vmax 0 0 -90vmax; background: repeating-conic-gradient(rgba(242, 182, 50, 0.07) 0 9deg, transparent 9deg 24deg); -webkit-mask: radial-gradient(closest-side, #000 10%, transparent 70%); mask: radial-gradient(closest-side, #000 10%, transparent 70%); animation: boot-spin 40s linear infinite; }
      #boot svg { position: relative; width: min(36vmin, 230px); height: auto; overflow: visible; }
      #boot .ball { animation: boot-hop 0.9s cubic-bezier(0.3, 0, 0.7, 1) infinite alternate; transform-origin: 60px 104px; }
      #boot .shade { animation: boot-shade 0.9s cubic-bezier(0.3, 0, 0.7, 1) infinite alternate; transform-origin: 60px 132px; }
      #boot b { position: relative; margin-top: 3vmin; color: #f2b632; font-size: min(12vmin, 80px); font-weight: 900; letter-spacing: 0.05em; -webkit-text-stroke: 0.16em #2a1a10; paint-order: stroke fill; text-shadow: 0 0.1em 0 #2a1a10; }
      #boot i { position: relative; margin-top: 5vmin; width: min(52vmin, 330px); height: min(4vmin, 24px); border: min(0.8vmin, 5px) solid #2a1a10; border-radius: 99px; background: #2a302c; overflow: hidden; box-shadow: 0 min(0.8vmin, 5px) 0 #0c0e0d; }
      #boot i::before, #boot i::after { content: ''; position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; background: #f2b632; box-shadow: inset 0 -0.3em 0 #c98a1c; }
      #boot i::before { width: 30%; animation: boot-creep 6s cubic-bezier(0.1, 0.6, 0.3, 1) both; }
      #boot i::after { width: calc(var(--p) * 100%); transition: width 0.25s ease-out; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-hop { from { transform: translateY(0) scale(1.12, 0.88); } 18% { transform: translateY(-6px) scale(1, 1); } to { transform: translateY(-46px) scale(0.97, 1.03); } }
      @keyframes boot-shade { from { transform: scale(1); opacity: 0.55; } to { transform: scale(0.6); opacity: 0.25; } }
      @keyframes boot-creep { from { width: 0; } }
      @media (prefers-reduced-motion: reduce) { #boot::before, #boot .ball, #boot .shade { animation: none; } }
    </style>
  </head>
  <body>
    <div id="boot">
      <svg viewBox="0 0 120 140" aria-hidden="true">
        <ellipse class="shade" cx="60" cy="132" rx="34" ry="7" fill="#000" />
        <g class="ball" stroke="#2a1a10" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="60" cy="62" r="42" fill="#f8e2c6" stroke-width="7" />
          <path d="M24 80a42 42 0 0 0 78-4a46 46 0 0 1-78 4z" fill="#e2b58c" stroke="none" />
          <path d="M60 22c-30 10-38 66 0 82M60 22c30 10 38 66 0 82M60 22c-12 14-14 66 0 82M60 22c12 14 14 66 0 82" fill="none" stroke="#c8322a" stroke-width="4" />
          <circle cx="60" cy="62" r="42" fill="none" stroke-width="7" />
          <path d="M50 14l10 8 10-8-4 12h-12z" fill="#c8322a" stroke-width="4" />
          <ellipse cx="44" cy="44" rx="9" ry="5" fill="#fff" stroke="none" opacity="0.7" transform="rotate(-35 44 44)" />
        </g>
      </svg>
      <b>HOLY KICKER</b><i></i>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
