# Holy Kicker's API on the box daydayup ("blightbloom") owns (server/README.md). Fully apart from
# daydayup: its own compose project, its own network, its own way in. The box's ports 80/443
# belong to daydayup's Caddy, so this publishes none; `tunnel` (cloudflared) dials out to
# Cloudflare instead, which serves hk.gamestao.com and sends its requests down that connection
# to `api`. Nothing of daydayup knows this project exists.
name: holykicker

services:
  api:
    build: .
    image: holykicker-api
    container_name: hk-api
    restart: unless-stopped
    env_file: .env
    # collected replays (server/src/replayShelf.ts), kept across deploys
    volumes:
      - replays:/data/replays
    # measured (server-hardening, 2026-10-22): ~75 MB idle, +17 MB RSS while re-simulating a long
    # run, plus a 3 MB replay body parsed per report or ranked run; the heap is capped below this in
    # the Dockerfile (--max-old-space-size), so V8 collects before the kernel kills the container
    mem_limit: 256m
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # A remotely managed tunnel: its route (hk.gamestao.com -> http://api:8080) is set on
  # Cloudflare's side; the token in .env is all it needs here.
  tunnel:
    image: cloudflare/cloudflared:2026.10.3
    container_name: hk-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${HK_TUNNEL_TOKEN:?HK_TUNNEL_TOKEN missing from .env}
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 128m
    logging: *logging

  # A nightly mongodump of the database (server/README.md "Backups"), kept HK_BACKUP_DAYS (14)
  # days on the `backups` volume. It reads only; nothing else depends on it.
  backup:
    image: mongo:8.0
    container_name: hk-backup
    restart: unless-stopped
    env_file: .env
    volumes:
      - backups:/backups
    mem_limit: 256m
    logging: *logging
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while :; do
          now=$$(date -u +%s); next=$$(date -u -d "$$(date -u +%F) 03:00" +%s)
          [ "$$next" -gt "$$now" ] || next=$$((next + 86400))
          sleep $$((next - now))
          f=/backups/holykicker-$$(date -u +%F).archive.gz
          if mongodump --uri="$$HK_MONGO_URI" --nsInclude="$${HK_MONGO_DB:-holykicker}.*" --gzip --archive="$$f.part" --quiet; then
            mv "$$f.part" "$$f"; echo "backup $$f $$(du -h "$$f" | cut -f1)"
          else
            rm -f "$$f.part"; echo "backup failed" >&2
          fi
          find /backups -name 'holykicker-*.archive.gz' -mtime +$${HK_BACKUP_DAYS:-14} -delete
        done

volumes:
  replays:
  backups:
