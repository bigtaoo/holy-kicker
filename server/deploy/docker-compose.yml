# Holy Kicker's API on the box daydayup ("blightbloom") owns (server/README.md). Fully apart from
# daydayup: its own compose project, its own network, its own way in. The box's ports 80/443
# belong to daydayup's Caddy, so this publishes none; `tunnel` (cloudflared) dials out to
# Cloudflare instead, which serves hk.gamestao.com and sends its requests down that connection
# to `api`. Nothing of daydayup knows this project exists.
name: holykicker

services:
  api:
    build: .
    image: holykicker-api
    container_name: hk-api
    restart: unless-stopped
    env_file: .env
    mem_limit: 128m
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # A remotely managed tunnel: its route (hk.gamestao.com -> http://api:8080) is set on
  # Cloudflare's side; the token in .env is all it needs here.
  tunnel:
    image: cloudflare/cloudflared:2026.9.3
    container_name: hk-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${HK_TUNNEL_TOKEN:?HK_TUNNEL_TOKEN missing from .env}
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 128m
    logging: *logging
